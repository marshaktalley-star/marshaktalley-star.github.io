<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marsha Kerr Talley | Turning Pain Into Possibility™</title>

  <meta
    name="description"
    content="Marsha Kerr Talley works with leaders and organisations to look beneath visible problems, examine the conditions affecting people and performance, and turn insight into practical change."
  >

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       BRAND
    ===================================================== */

    :root {

      --teal-deep: #043b3d;
      --teal-dark: #056367;
      --teal: #319fa2;
      --teal-mid: #5aa3a6;
      --teal-light: #2fe2dd;
      --teal-pale: #eefafa;

      --gold: #c9a86a;
      --gold-soft: #eadbc1;

      --cream: #f8f5ef;
      --white: #ffffff;

      --ink: #173234;
      --body: #526263;
      --muted: #718080;
      --line: #dce9e8;

      --heading:
        "Playfair Display",
        Georgia,
        serif;

      --body-font:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --page-width: 1200px;
    }


    /* =====================================================
       RESET
    ===================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--white);
      color: var(--body);
      font-family: var(--body-font);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
      font-family: var(--heading);
      color: var(--ink);
      line-height: 1.08;
    }

    p {
      margin-top: 0;
    }

    .page-wrap {
      width: min(
        calc(100% - 40px),
        var(--page-width)
      );

      margin: 0 auto;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .site-header {
      width: 100%;
      background: #ffffff;
    }

    .header-inner {
      width: min(
        calc(100% - 40px),
        var(--page-width)
      );

      margin: 0 auto;

      padding: 20px 0 13px;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;
    }

    .site-logo {
      display: inline-block;
      text-decoration: none;
    }

    .site-logo img {
      width: 220px;
      height: auto;
      margin: 0 auto 13px;
    }


    /* NAV */

    .site-nav ul {
      list-style: none;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 27px;

      padding: 0;
      margin: 0;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .site-nav a {
      color: #343434;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .site-nav a:hover,
    .site-nav a.active {
      color: var(--teal-dark);
      font-weight: 600;
    }


    /* MOBILE MENU */

    .nav-toggle {
      display: none;

      position: absolute;
      top: 20px;
      right: 0;

      width: 44px;
      height: 44px;

      border: 0;
      background: transparent;

      color: var(--teal-dark);

      font-size: 28px;
      cursor: pointer;
    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .button-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 12px;
    }

    .btn {

      min-height: 52px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 13px 28px;

      border-radius: 999px;
      border: 1px solid transparent;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--teal-dark);
      color: #ffffff;

      box-shadow:
        0 11px 26px rgba(5,99,103,0.20);
    }

    .btn-primary:hover {
      background: var(--teal-deep);

      box-shadow:
        0 15px 32px rgba(5,99,103,0.25);
    }

    .btn-soft {
      background: var(--teal-mid);
      color: #ffffff;

      box-shadow:
        0 10px 25px rgba(90,163,166,0.18);
    }

    .btn-outline {
      background: transparent;

      border-color:
        rgba(5,99,103,0.28);

      color: var(--teal-dark);
    }

    .btn-outline:hover {
      background: var(--teal-pale);
    }

    .btn-light {
      background: #ffffff;
      color: var(--teal-deep);

      box-shadow:
        0 12px 28px rgba(0,0,0,0.13);
    }


    /* =====================================================
       BANNER IMAGE
    ===================================================== */

    .banner-section {
      padding: 24px 0 0;
    }

    .banner-image {

      width: 100%;

      border-radius: 17px;

      box-shadow:
        0 20px 48px rgba(5,99,103,0.09);
    }


    /* =====================================================
       INTRO / HERO COPY
    ===================================================== */

    .intro
