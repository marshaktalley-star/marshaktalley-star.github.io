  <script src="/_sdk/1b56991da13617fe.editing_sdk.js" integrity="sha512-7QHNPLPvkV/StrSqMG/kmvYbG8mJP4lGjSAmVe52ZYilblz47/1vWJa6sAdgi1w/a7EbAadWwTEJWNjrpiUkfg=="></script>
  <script>
    let currentScenario = 1;
    let secondsLeft = 20;
    let timerId = null;
    let answered = false;

    const timerValue = document.getElementById("timer-value");
    const timerRing = document.getElementById("timer-ring");
    const status = document.getElementById("game-status");
    const roundLabel = document.getElementById("round-label");

    function updateTimer() {
      timerValue.textContent = secondsLeft;
      timerRing.classList.toggle("is-urgent", secondsLeft <= 5 && secondsLeft > 0);
    }

    function startTimer() {
      clearInterval(timerId);
      secondsLeft = 20;
      answered = false;
      updateTimer();

      timerId = setInterval(() => {
        secondsLeft -= 1;
        updateTimer();

        if (secondsLeft <= 0) {
          clearInterval(timerId);
          handleTimeout();
        }
      }, 1000);
    }

    function revealNext(scenario) {
      document.getElementById("next-" + scenario).classList.add("is-visible");
    }

    function handleTimeout() {
      if (answered) return;
      answered = true;

      const timeoutCard = document.getElementById("s" + currentScenario + "-timeout");
      timeoutCard.classList.add("is-visible");
      document.querySelectorAll('#scenario-' + currentScenario + ' .choice-button').forEach(button => {
        button.disabled = true;
      });
      revealNext(currentScenario);
      status.textContent = "Time is up. Consider the information you would need before acting.";
    }

    function chooseAction(button) {
      if (answered) return;
      answered = true;
      clearInterval(timerId);

      const scenario = button.dataset.scenario;
      const choice = button.dataset.choice;

      document.querySelectorAll('#scenario-' + scenario + ' .choice-button').forEach(choiceButton => {
        choiceButton.disabled = true;
      });

      button.classList.add("is-picked");
      document.getElementById("s" + scenario + "-" + choice).classList.add("is-visible");
      revealNext(scenario);
      status.textContent = "Choice selected. Your reflection prompt is now visible.";
    }

    function showScenario(nextScenario) {
      document.querySelectorAll(".scenario-panel").forEach(panel => panel.classList.remove("is-active"));
      document.getElementById("final-panel").classList.remove("is-active");

      currentScenario = nextScenario;
      document.getElementById("scenario-" + nextScenario).classList.add("is-active");
      roundLabel.textContent = "Round " + nextScenario + " of 3";

      document.querySelectorAll(".progress-dot").forEach((dot, index) => {
        dot.classList.toggle("is-current", index === nextScenario - 1);
        dot.classList.toggle("is-complete", index < nextScenario - 1);
      });

      status.textContent = "Round " + nextScenario + " of 3 has started. You have 20 seconds.";
      startTimer();
    }

    function showFinal() {
      clearInterval(timerId);
      document.querySelectorAll(".scenario-panel").forEach(panel => panel.classList.remove("is-active"));
      document.getElementById("final-panel").classList.add("is-active");
      roundLabel.textContent = "Complete";
      timerValue.textContent = "✓";
      timerRing.classList.remove("is-urgent");
      document.querySelectorAll(".progress-dot").forEach(dot => {
        dot.classList.add("is-complete");
        dot.classList.remove("is-current");
      });
      status.textContent = "Game complete. The final principle is visible.";
    }

    function resetGame() {
      clearInterval(timerId);

      document.querySelectorAll(".reflection-card").forEach(card => card.classList.remove("is-visible"));
      document.querySelectorAll(".next-row").forEach(row => row.classList.remove("is-visible"));
      document.querySelectorAll(".choice-button").forEach(button => {
        button.disabled = false;
        button.classList.remove("is-picked");
      });

      showScenario(1);
    }

    document.querySelectorAll(".choice-button").forEach(button => {
      button.addEventListener("click", () => chooseAction(button));
    });

    document.querySelectorAll("[data-next]").forEach(button => {
      button.addEventListener("click", () => {
        const next = button.dataset.next;
        if (next === "final") {
          showFinal();
        } else {
          showScenario(Number(next));
        }
      });
    });

    document.getElementById("replay-button").addEventListener("click", resetGame);

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-template-id$='-next'] .button-label").forEach(label => {
        const parent = label.closest("[data-template-id]");
        label.textContent = parent.textContent.trim();
      });
      const replayLabel = document.querySelector("#replay-button .button-label");
      replayLabel.textContent = document.getElementById("replay-button").textContent.trim();
      lucide.createIcons();
      startTimer();
    });
  </script>
