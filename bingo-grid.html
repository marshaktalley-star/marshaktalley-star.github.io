<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#5f35a8">
  <title>Find Someone Who... Bingo</title>
  <style>
    :root{--pd:#2f155f;--p:#6336ad;--pl:#efe7fb;--pm:#b99bdd;--w:#fff;--ink:#201b2c;--muted:#6c6478;--g:#16794b;--gs:#e7f7ee;--b:#d7cae7;--gold:#f2b93b;--sh:0 16px 42px rgba(47,21,95,.16)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(99,54,173,.18),transparent 28rem),linear-gradient(180deg,#f7f1fd 0%,#fff 45%,#f6f1fb 100%)}
    button,input{font:inherit} button{cursor:pointer}.page{width:min(980px,calc(100% - 16px));margin:0 auto;padding:12px 0 44px}.hero{padding:clamp(20px,4vw,40px);color:#fff;text-align:center;background:linear-gradient(135deg,var(--pd),var(--p));border-radius:22px;box-shadow:var(--sh)}
    .hero h1{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,6vw,4.5rem);line-height:1}.hero p{max-width:700px;margin:0 auto;color:#efe9f8;font-size:clamp(.92rem,2vw,1.08rem)}
    .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end;margin:14px 0;padding:12px;background:rgba(255,255,255,.95);border:1px solid var(--b);border-radius:15px}label{font-weight:800}.player-input,.modal-input{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--ink)}
    .btn{min-height:44px;padding:10px 14px;border:0;border-radius:10px;font-weight:850}.btn-primary{color:#fff;background:var(--p)}.btn-secondary{color:var(--pd);background:var(--pl)}
    .progress-wrap{margin-bottom:12px;padding:12px 14px;background:#fff;border:1px solid var(--b);border-radius:14px}.progress-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:800;font-size:.92rem}.progress-track{overflow:hidden;height:10px;background:#eee8f4;border-radius:999px}.progress-bar{width:11.11%;height:100%;background:linear-gradient(90deg,var(--p),#9771c6);transition:width .2s ease}
    .bingo-shell{padding:clamp(6px,1.6vw,14px);background:var(--pd);border-radius:20px;box-shadow:var(--sh)}.bingo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(5px,1.4vw,10px);aspect-ratio:1/1}
    .square{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:clamp(5px,1.5vw,14px);text-align:center;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:clamp(9px,2vw,15px);overflow:hidden;transition:.15s ease}.square.completed{background:var(--gs);border-color:#74bd98}.square.winning{border-color:var(--gold);box-shadow:inset 0 0 0 3px rgba(242,185,59,.35)}button.square{width:100%}
    .square-number{position:absolute;top:clamp(4px,1vw,9px);left:clamp(4px,1vw,9px);display:grid;place-items:center;width:clamp(20px,4vw,31px);height:clamp(20px,4vw,31px);color:#fff;background:var(--p);border-radius:50%;font-size:clamp(.66rem,1.6vw,.9rem);font-weight:900}.icon{margin-bottom:clamp(4px,1vw,9px);font-size:clamp(1.15rem,4vw,2.3rem);line-height:1}.prompt{display:-webkit-box;overflow:hidden;margin:0;font-size:clamp(.64rem,2.05vw,1.15rem);font-weight:900;line-height:1.13;-webkit-box-orient:vertical;-webkit-line-clamp:4}.entered-name{width:100%;margin-top:clamp(4px,1vw,9px);overflow:hidden;color:var(--g);font-size:clamp(.56rem,1.7vw,.88rem);font-weight:900;text-overflow:ellipsis;white-space:nowrap}.tap-text{margin-top:clamp(3px,.8vw,7px);color:var(--muted);font-size:clamp(.52rem,1.5vw,.76rem);font-weight:700}
    .free-space{color:var(--pd);background:radial-gradient(circle at center,rgba(99,54,173,.17),transparent 62%),var(--pl);border-color:var(--pm)}.free-space strong{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.05rem,4.5vw,2.45rem);line-height:1}.free-space span{margin-top:4px;font-size:clamp(.55rem,1.6vw,.82rem);font-weight:900;letter-spacing:.08em}.status{margin-top:12px;padding:12px 14px;text-align:center;color:var(--pd);background:var(--pl);border-radius:13px;font-weight:800}.hint{margin:10px 0 0;text-align:center;color:var(--muted);font-size:.82rem}
    .modal,.celebration{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:18px;background:rgba(31,13,61,.76);backdrop-filter:blur(4px)}.show{display:flex}.dialog{width:min(440px,100%);padding:24px;background:#fff;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.26)}.dialog h2{margin:0 0 8px;color:var(--pd);font-size:1.45rem}.dialog p{margin:0 0 16px;color:var(--muted)}.dialog-actions{display:flex;gap:10px;margin-top:16px}.dialog-actions .btn{flex:1}.celebration .dialog{text-align:center}.celebration-emoji{font-size:4rem}.celebration h2{margin:4px 0 8px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.7rem,11vw,5.8rem);line-height:.95}.confetti{pointer-events:none;position:fixed;inset:0;z-index:49;overflow:hidden}.confetti-piece{position:absolute;top:-20px;width:9px;height:17px;border-radius:2px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(760deg)}}
    @media(max-width:620px){.page{width:min(100% - 8px,980px);padding-top:4px}.hero{padding:18px 12px;border-radius:17px}.topbar{grid-template-columns:1fr 1fr}.player-field{grid-column:1/-1}.bingo-shell{padding:5px;border-radius:14px}.bingo-grid{gap:4px}.square{border-width:1.5px;border-radius:8px}.icon{margin-top:6px}.tap-text{display:none}}
  </style>
</head>
<body>
<main class="page">
<header class="hero"><h1>Find Someone Who...</h1><p>Tap a square, enter a person’s name, and complete any row, column, or diagonal to get BINGO.</p></header>
<section class="topbar"><div class="player-field"><label for="playerName">Your name</label><input class="player-input" id="playerName" maxlength="60" placeholder="Enter your name"></div><button class="btn btn-secondary" id="clearButton">Clear</button><button class="btn btn-primary" id="checkButton">Check Bingo</button></section>
<section class="progress-wrap"><div class="progress-row"><span>Progress</span><span id="progressText">1 of 9 complete</span></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="1"><div class="progress-bar" id="progressBar"></div></div></section>
<section class="bingo-shell"><div class="bingo-grid" id="bingoGrid">
<button class="square" data-index="0" data-prompt="Has used Canva"><span class="square-number">1</span><span class="icon">🎨</span><span class="prompt">Has used Canva</span><span class="entered-name" id="display-0"></span><span class="tap-text">Tap to add name</span></button>
<button class="square" data-index="1" data-prompt="Has never used AI"><span class="square-number">2</span><span class="icon">🚫🤖</span><span class="prompt">Has never used AI</span><span class="entered-name" id="display-1"></span><span class="tap-text">Tap to add name</span></button>
<button class="square" data-index="2" data-prompt="Has created a logo"><span class="square-number">3</span><span class="icon">✒️</span><span class="prompt">Has created a logo</span><span class="entered-name" id="display-2"></span><span class="tap-text">Tap to add name</span></button>
<button class="square" data-index="3" data-prompt="Has edited a video"><span class="square-number">4</span><span class="icon">🎬</span><span class="prompt">Has edited a video</span><span class="entered-name" id="display-3"></span><span class="tap-text">Tap to add name</span></button>
<div class="square free-space completed" data-index="4"><strong>FREE</strong><span>SPACE</span></div>
<button class="square" data-index="5" data-prompt="Uses ChatGPT"><span class="square-number">5</span><span class="icon">💬</span><span class="prompt">Uses ChatGPT</span><span class="entered-name" id="display-5"></span><span class="tap-text">Tap to add name</span></button>
<button class="square" data-index="6" data-prompt="Has sold something online"><span class="square-number">6</span><span class="icon">🛒</span><span class="prompt">Has sold something online</span><span class="entered-name" id="display-6"></span><span class="tap-text">Tap to add name</span></button>
<button class="square" data-index="7" data-prompt="Has posted on social media for a business"><span class="square-number">7</span><span class="icon">📱</span><span class="prompt">Has posted on social media for a business</span><span class="entered-name" id="display-7"></span><span class="tap-text">Tap to add name</span></button>
<button class="square" data-index="8" data-prompt="Has used Google Docs"><span class="square-number">8</span><span class="icon">📄</span><span class="prompt">Has used Google Docs</span><span class="entered-name" id="display-8"></span><span class="tap-text">Tap to add name</span></button>
</div></section>
<div class="status" id="statusMessage">Tap any square to enter a name.</div><p class="hint">Your entries are saved automatically on this device.</p>
</main>
<div class="modal" id="nameModal"><div class="dialog"><h2 id="modalTitle">Add a name</h2><p id="modalPrompt"></p><label for="modalName">Person’s name</label><input class="modal-input" id="modalName" maxlength="60" placeholder="Type the person’s name"><div class="dialog-actions"><button class="btn btn-secondary" id="cancelModal">Cancel</button><button class="btn btn-primary" id="saveName">Save Name</button></div></div></div>
<div class="confetti" id="confetti"></div>
<div class="celebration" id="celebration"><div class="dialog"><div class="celebration-emoji">🎉</div><h2>BINGO!</h2><p id="celebrationMessage">You completed a winning line.</p><button class="btn btn-primary" id="closeCelebration">Keep Playing</button></div></div>
<script>
"use strict";
const storageKey="real-grid-bingo-v2",squares=[...document.querySelectorAll('.square')],playable=[...document.querySelectorAll('button.square')],playerName=document.getElementById('playerName'),progressText=document.getElementById('progressText'),progressBar=document.getElementById('progressBar'),progressTrack=document.querySelector('.progress-track'),statusMessage=document.getElementById('statusMessage'),nameModal=document.getElementById('nameModal'),modalTitle=document.getElementById('modalTitle'),modalPrompt=document.getElementById('modalPrompt'),modalName=document.getElementById('modalName'),cancelModal=document.getElementById('cancelModal'),saveName=document.getElementById('saveName'),checkButton=document.getElementById('checkButton'),clearButton=document.getElementById('clearButton'),celebration=document.getElementById('celebration'),celebrationMessage=document.getElementById('celebrationMessage'),closeCelebration=document.getElementById('closeCelebration'),confetti=document.getElementById('confetti');
let activeIndex=null;const names={0:"",1:"",2:"",3:"",5:"",6:"",7:"",8:""};const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const completed=()=>squares.map((_,i)=>i===4||Boolean(names[i]?.trim()));
function saveState(){localStorage.setItem(storageKey,JSON.stringify({player:playerName.value,names}))}
function loadState(){try{const s=JSON.parse(localStorage.getItem(storageKey));if(!s)return;playerName.value=s.player||"";Object.keys(names).forEach(k=>names[k]=s.names?.[k]||"")}catch(e){}}
function render(){squares.forEach((sq,i)=>{sq.classList.remove('winning');if(i===4){sq.classList.add('completed');return}const d=document.getElementById(`display-${i}`),has=Boolean(names[i].trim());sq.classList.toggle('completed',has);d.textContent=has?`✓ ${names[i]}`:""});const c=completed().filter(Boolean).length;progressText.textContent=`${c} of 9 complete`;progressBar.style.width=`${c/9*100}%`;progressTrack.setAttribute('aria-valuenow',String(c));saveState()}
function winning(){const c=completed();return lines.find(line=>line.every(i=>c[i]))||null}
function openModal(sq){activeIndex=Number(sq.dataset.index);modalTitle.textContent=names[activeIndex]?"Edit name":"Add a name";modalPrompt.textContent=sq.dataset.prompt;modalName.value=names[activeIndex]||"";nameModal.classList.add('show');setTimeout(()=>modalName.focus(),0)}
function closeModal(){nameModal.classList.remove('show');activeIndex=null}
function showBingo(line){line.forEach(i=>squares[i].classList.add('winning'));celebrationMessage.textContent=playerName.value.trim()?`${playerName.value.trim()}, you completed a winning line!`:"You completed a winning line!";statusMessage.textContent="BINGO! You completed a row, column, or diagonal.";celebration.classList.add('show');confetti.innerHTML="";const colors=['#6336ad','#f2b93b','#2aa876','#e86485','#4f7ad9'];for(let i=0;i<90;i++){const p=document.createElement('span');p.className='confetti-piece';p.style.left=`${Math.random()*100}%`;p.style.background=colors[i%colors.length];p.style.animationDuration=`${2.2+Math.random()*2.4}s`;p.style.animationDelay=`${Math.random()*.6}s`;p.style.setProperty('--drift',`${-100+Math.random()*200}px`);confetti.appendChild(p)}}
function saveCurrent(){if(activeIndex===null)return;names[activeIndex]=modalName.value.trim();render();closeModal();const line=winning();if(line)showBingo(line);else statusMessage.textContent=names[activeIndex]?"Square completed. Keep mingling!":"Name removed from the square."}
playable.forEach(s=>s.addEventListener('click',()=>openModal(s)));saveName.addEventListener('click',saveCurrent);cancelModal.addEventListener('click',closeModal);modalName.addEventListener('keydown',e=>{if(e.key==='Enter')saveCurrent()});checkButton.addEventListener('click',()=>{render();const line=winning();if(line)showBingo(line);else statusMessage.textContent="Not yet. Complete a full row, column, or diagonal."});clearButton.addEventListener('click',()=>{if(!confirm('Clear all names and restart the card?'))return;Object.keys(names).forEach(k=>names[k]="");playerName.value="";localStorage.removeItem(storageKey);render();statusMessage.textContent="Card cleared. Start mingling again!"});closeCelebration.addEventListener('click',()=>{celebration.classList.remove('show');confetti.innerHTML=""});playerName.addEventListener('input',saveState);nameModal.addEventListener('click',e=>{if(e.target===nameModal)closeModal()});celebration.addEventListener('click',e=>{if(e.target===celebration){celebration.classList.remove('show');confetti.innerHTML=""}});loadState();render();
</script>
</body>
</html>
